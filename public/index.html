<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Portfolio</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Custom CSS -->
<link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">
                My Portfolio
            </a>
        </div>
    </nav>

    <main class="container mt-5">
<!-- 1. Create Portfolio Section       -->
        <section aria-labelledby="create-portfolio-heading">

            <h2 id="create-portfolio-heading" class="text-center mb-4">
                Create Portfolio
            </h2>

            <div class="card p-4 shadow-sm">

                <form id="portfolio-form">

                    <div class="mb-3">
                        <label for="name" class="form-label">
                            Name / Alias
                        </label>

                        <input type="text" class="form-control" id="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="enjoy" class="form-label">
                            What I Enjoy
                        </label>

                        <textarea class="form-control" id="enjoy" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="tried" class="form-label">
                            What I've Tried
                        </label>

                        <textarea class="form-control" id="tried" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="curious" class="form-label">
                            What I'm Curious About
                        </label>

                        <textarea class="form-control" id="curious" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-dark">
                        Create Portfolio
                    </button>

                </form>

            </div>

        </section>


        
        <!-- 2. Create Portfolio Result        -->
     

        <div id="result" class="mt-4"></div>


        <!-- 3. Add Portfolio Item Section     -->
       
        <section id="add-portfolio-item" class="mt-5 mb-5" aria-labelledby="add-item-heading">

            <h2 id="add-item-heading" class="text-center mb-4">
                Add Portfolio Item
            </h2>

            <div class="card p-4 shadow-sm">

                <form id="item-form">

                    <!-- Basic Information -->
                    <h5 class="mb-3">
                        Basic Information
                    </h5>

                    <!-- Title -->
                    <div class="mb-3">

                        <label for="item-title" class="form-label">
                            Title
                        </label>

                        <input type="text" class="form-control" id="item-title" name="title"
                            placeholder="Enter item title" required>

                    </div>


                    <!-- Type and Date -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="item-type" class="form-label">
                                Type
                            </label>

                            <input type="text" class="form-control" id="item-type" name="type"
                                placeholder="Course Assignment" required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label for="item-date" class="form-label">
                                Date
                            </label>

                            <input type="date" class="form-control" id="item-date" name="date" required>

                        </div>

                    </div>


                    <!-- Role -->
                    <div class="mb-3">

                        <label for="item-role" class="form-label">
                            Role
                        </label>

                        <input type="text" class="form-control" id="item-role" name="role" placeholder="Enter your role"
                            required>

                    </div>


                    <!-- Description -->
                    <div class="mb-4">

                        <label for="item-description" class="form-label">
                            Description
                        </label>

                        <textarea class="form-control" id="item-description" name="description" rows="3"
                            placeholder="Describe your work or activity" required></textarea>

                    </div>


                    <hr>


                    <!-- Skills -->
                    <h5 class="mb-3">
                        Skills
                    </h5>

                    <div class="mb-4">

                        <label for="item-skills" class="form-label">
                            Skills
                        </label>

                        <input type="text" class="form-control" id="item-skills" name="skills"
                            placeholder="HTML, CSS, JavaScript" required>

                        <div class="form-text">
                            Separate skills using commas.
                        </div>

                    </div>


                    <hr>


                    <!-- Reflection -->
                    <h5 class="mb-3">
                        Reflection
                    </h5>

                    <!-- What I did -->
                    <div class="mb-3">

                        <label for="what-i-did" class="form-label">
                            What I did
                        </label>

                        <textarea class="form-control" id="what-i-did" name="whatIDid" rows="2" required></textarea>

                    </div>


                    <!-- What I learned -->
                    <div class="mb-3">

                        <label for="what-i-learned" class="form-label">
                            What I learned
                        </label>

                        <textarea class="form-control" id="what-i-learned" name="whatILearned" rows="2"
                            required></textarea>

                    </div>


                    <!-- Challenge -->
                    <div class="mb-3">

                        <label for="challenge" class="form-label">
                            Challenge
                        </label>

                        <textarea class="form-control" id="challenge" name="challenge" rows="2" required></textarea>

                    </div>


                    <!-- Next Step -->
                    <div class="mb-4">

                        <label for="next-step" class="form-label">
                            Next Step
                        </label>

                        <textarea class="form-control" id="next-step" name="nextStep" rows="2" required></textarea>

                    </div>


                    <hr>


                    <!-- Evidence -->
                    <h5 class="mb-3">
                        Evidence
                    </h5>

                    <div class="mb-4">

                        <label for="item-evidence" class="form-label">
                            Evidence URL
                        </label>

                        <input type="url" class="form-control" id="item-evidence" name="evidence"
                            placeholder="https://example.com/my-work" required>

                    </div>


                    <!-- Submit -->
                    <button type="submit" class="btn btn-dark w-100">
                        Add Portfolio Item
                    </button>

                </form>

                <!-- Submission Status -->
                <p id="item-status" class="mt-3 mb-0" role="status" aria-live="polite"></p>

            </div>

        </section>

    </main>


    <!-- Existing Create Portfolio JavaScript -->
    <script src="script.js"></script>

    <!-- Add Portfolio Item JavaScript -->
    <script src="add-item.js"></script>

</body>

</html>
