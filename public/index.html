
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">My Portfolio</a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Create Portfolio</h2>

        <div class="card p-4 shadow-sm">
            <form id="portfolio-form">

                <div class="mb-3">
                    <label class="form-label">Name / Alias</label>
                    <input type="text" class="form-control"
                           id="name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">What I Enjoy</label>
                    <textarea class="form-control"
                              id="enjoy" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">What I've Tried</label>
                    <textarea class="form-control"
                              id="tried" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">What I'm Curious About</label>
                    <textarea class="form-control"
                              id="curious" required></textarea>
                </div>

                <button type="submit" class="btn btn-dark">
                    Create Portfolio
                </button>

            </form>
        </div>

        <div id="result" class="mt-4"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
